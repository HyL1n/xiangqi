<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>象棋 · 和朋友下一盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fdf4e0' stroke='%23b3251f' stroke-width='4'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23b3251f' font-family='serif'%3E%E5%B8%A5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="logo">帅</div>
      <div>
        <h1>象棋</h1>
        <p>和朋友下一盘</p>
      </div>
    </div>
    <div class="topbar-actions" id="topbarActions" hidden>
      <span class="conn" id="connState"><span class="dot"></span><b>连接中…</b></span>
      <button class="chip" id="codeChip" title="点击复制邀请链接">
        <span class="chip-label">房间号</span><b id="roomCode">----</b>
      </button>
      <button class="btn mini ghost" id="btnInvite">邀请链接</button>
      <button class="btn mini ghost" id="btnExit">退出房间</button>
    </div>
  </header>

  <main>
    <div class="board-area">
      <div class="board-wrap">
        <div class="board-box" id="boardBox">
          <canvas id="board"></canvas>
          <div class="grid" id="grid"></div>
        </div>

        <div class="board-tools" id="boardTools" hidden>
          <button class="tool" id="btnFlip" title="翻转棋盘" aria-label="翻转棋盘">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3.5v13"/><path d="M4.5 13.5 8 17l3.5-3.5"/>
              <path d="M16 20.5v-13"/><path d="M12.5 10.5 16 7l3.5 3.5"/>
            </svg>
          </button>
          <button class="tool" id="btnTheme" title="切换棋盘外观" aria-label="切换棋盘外观">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"/>
              <path class="solid" d="M12 4a8 8 0 0 0 0 16z"/>
            </svg>
          </button>
          <select class="tool-sel" id="fontSel" title="棋子字体" aria-label="棋子字体">
            <option value="kai">楷体</option>
            <option value="song">宋体</option>
            <option value="hei">黑体</option>
            <option value="yuan">幼圆</option>
            <option value="li">隶书</option>
          </select>
          <button class="tool" id="btnSound" title="声音开关" aria-label="声音开关" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h3l4-3.2v11.4l-4-3.2H4z"/>
              <path class="w1" d="M14.6 9.4a3.6 3.6 0 0 1 0 5.2"/>
              <path class="w2" d="M17 7a7 7 0 0 1 0 10"/>
              <path class="mute" d="M15 9.5l5.5 5.5M20.5 9.5 15 15"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="bar">
        <div id="statusText">等待开始…</div>
        <div id="statusRight" style="display:flex;align-items:center;gap:8px"></div>
      </div>

      <div class="linkbox hidden" id="linkBox">
        <input id="linkInput" readonly>
        <button class="btn mini" id="btnCopyLink">复制</button>
        <button class="btn mini ghost" id="btnCloseLink">收起</button>
      </div>
    </div>

    <aside class="panel">
      <div class="players" id="players"></div>
      <div class="actions" id="actions"></div>
      <div class="card">
        <div class="section-title"><span>棋谱记录</span><span id="histCount"></span></div>
        <div class="hist" id="hist"></div>
      </div>
      <div class="card chatcard" id="chatCard">
        <div class="section-title"><span>聊天</span><span id="chatHint"></span></div>
        <div class="chatlog" id="chatlog"></div>
        <form id="chatform">
          <input id="chatinput" maxlength="200" placeholder="说点什么…" autocomplete="off">
          <button class="btn" type="submit">发送</button>
        </form>
      </div>
    </aside>
  </main>
</div>

<div class="overlay" id="lobby">
  <div class="lobbycard">
    <h2>象棋</h2>
    <p class="sub">和朋友在浏览器里下一盘。</p>

    <div class="field">
      <label for="nameInput">你的名字</label>
      <input id="nameInput" maxlength="12" placeholder="例如：老王" autocomplete="off">
    </div>

    <div class="field">
      <label>用时（每人总时长）</label>
      <div class="seg" id="timeSeg">
        <button type="button" data-min="0">不限时</button>
        <button type="button" data-min="5">5 分钟</button>
        <button type="button" data-min="10" aria-pressed="true">10 分钟</button>
        <button type="button" data-min="15">15 分钟</button>
        <button type="button" data-min="30">30 分钟</button>
      </div>
    </div>

    <button class="btn primary" id="btnCreate" style="width:100%;padding:12px">创建房间，我执红先行</button>

    <div class="field" style="margin:14px 0 0">
      <label for="codeInput">或者加入朋友的房间</label>
      <div class="joinrow">
        <input id="codeInput" maxlength="8" placeholder="房间号" autocomplete="off">
        <button class="btn" id="btnJoin">加入</button>
      </div>
    </div>

    <div class="or">没有网络也能玩</div>

    <button class="btn ghost" id="btnLocal" style="width:100%">同一台设备上轮流下（本地对局）</button>

    <div class="joinrow" style="margin-top:8px">
      <label for="aiLevel">难度</label>
      <select id="aiLevel" class="btn" title="电脑棋力（难度）" aria-label="电脑棋力（难度）">
        <option value="easy">简单</option>
        <option value="normal" selected>普通</option>
        <option value="hard">较难</option>
      </select>
      <button class="btn" id="btnAI">和电脑对弈</button>
    </div>
    <p class="tiny"><b>较难</b>是电脑最强的一档。</p>

    <p class="sub tiny" id="lobbyHint"></p>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- 对方请求 / 对局结果用弹窗，放在棋盘正上方，避免看不到 -->
<div class="overlay" id="modal" hidden>
  <div class="modalcard" id="modalCard"></div>
</div>

<script src="rules.js"></script>
<script src="engine.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
